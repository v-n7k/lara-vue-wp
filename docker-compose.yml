######################
# - VPS (Wordpress)- #
######################
name: vps-${PRODUCT_NAME:-vps}

############
# Services #
############
services:
    portainer:
        container_name: ${PRODUCT_NAME:-vps}-portainer
        image: portainer/portainer-ce:lts # official image
        hostname: ${PORTAINER_HOST:-portainer}
        domainname: ${PORTAINER_DOMAIN:-${CORE_DOMAIN:-localhost}}
        labels:
            nginx.auth: "true"
            nginx.schema: "https"
            nginx.port: "9443"
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./volumes/portainer:/data

    db:
        container_name: ${PRODUCT_NAME:-vps}-db
        image: mysql:8.4 # official image
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - ./volumes/mysql8:/var/lib/mysql
            - ./configs/mysql/performance.cnf:/etc/mysql/conf.d/performance.cnf:ro
            - ./configs/mysql/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro

    phpmyadmin:
        container_name: ${PRODUCT_NAME:-vps}-phpmyadmin
        image: phpmyadmin:5.2 # official image
        hostname: ${PMA_HOST:-pma}
        domainname: ${PMA_DOMAIN:-${CORE_DOMAIN:-localhost}}
        labels:
            nginx.auth: "true"
        restart: always
        depends_on:
            - db
        environment:
            PMA_HOST: db
#            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        volumes:
            - ./configs/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

    wordpress:
        container_name: ${PRODUCT_NAME:-vps}-wordpress
        image: wordpress:6.8 # official image
        hostname: ${WP_HOST:-www}
        domainname: ${WP_DOMAIN:-${CORE_DOMAIN:-localhost}}
        restart: always
        depends_on:
            - db
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: ${MYSQL_USER}
            WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
            WORDPRESS_CONFIG_EXTRA: |
                if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $$_SERVER['HTTPS'] = 'on';
                }
        volumes:
            - ./volumes/wordpress:/var/www/html
            - ./configs/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

    nginx:
        container_name: ${PRODUCT_NAME:-vps}-nginx
        image: nginx:alpine
        restart: always
        ports:
            - "443:443"
        volumes:
            - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./configs/nginx/conf.d:/etc/nginx/conf.d:ro
            # Clean, dedicated directory for your 15-year Cloudflare keys
            - ./certs:/etc/nginx/certs:ro
            - ./auth:/etc/nginx/auth:ro # Directory holding .htpasswd
